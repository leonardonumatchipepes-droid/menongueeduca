<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=0.9, user-scalable=no">
<title>VUNONGUE IA</title>

<!-- PDF.js e Base de Conhecimento -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.10.142/pdf.min.js"></script>
<script src="dados/BaseConhecimentoIA.js"></script>

<style>
body { font-family: 'Inter', Arial, sans-serif; display:flex; flex-direction:column; height:100vh; margin:0; overflow-x: hidden; width: 100%; background: #eef2f7; }
header { background:#0b3d91; color:white; padding:15px; text-align:center; display:flex; justify-content:center; align-items:center; gap:12px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 10; }
header img { width:40px; border-radius:50%; border: 2px solid #f59e0b; }
header h1 { font-size: 1.2rem; margin: 0; font-weight: 800; letter-spacing: 1px; }

.chat-container { flex:1; display:flex; flex-direction:column; background:#fff; margin:10px; border-radius:20px; overflow:hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 1px solid #ddd; }
.messages { flex:1; overflow-y:auto; padding:20px; background: #f8f9fa; display: flex; flex-direction: column; }

.message { margin-bottom:18px; max-width: 85%; display:flex; flex-direction: column; }
.user { align-self: flex-end; align-items: flex-end; }
.bot { align-self: flex-start; align-items: flex-start; }

.bubble { padding:14px 18px; border-radius:20px; font-size: 0.95rem; line-height: 1.5; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
.user .bubble { background:#0b3d91; color:white; border-bottom-right-radius:4px; }
.bot .bubble { background:#ffffff; color:#212529; border-bottom-left-radius:4px; border: 1px solid #dee2e6; }

.input-area { display:flex; border-top:1px solid #dee2e6; background: white; padding: 15px; gap: 10px; align-items: center; }
input { flex:1; padding:14px; font-size:16px; border:1px solid #ddd; outline:none; border-radius: 30px; background: #f1f3f4; transition: 0.3s; }
input:focus { border-color: #0b3d91; background: #fff; box-shadow: 0 0 0 3px rgba(11,61,145,0.1); }

button.send-btn { width: 50px; height: 50px; background:#f59e0b; border:none; cursor:pointer; color: white; border-radius: 50%; font-size: 1.4rem; transition: 0.3s; display: flex; align-items: center; justify-content: center; }

.sugestoes { background:#fff; padding:12px; display:flex; flex-wrap:nowrap; gap:10px; overflow-x: auto; border-top:1px solid #eee; }
.sugestoes span { cursor:pointer; color:#0b3d91; background:#e7f0ff; padding:8px 16px; border-radius:25px; border: 1px solid #cce0ff; font-weight: 600; white-space: nowrap; font-size: 0.85rem; }

.loading { font-style: italic; color: #0b3d91; font-size: 0.9rem; margin: 10px; display: none; text-align: center; font-weight: bold; }
.source-tag { font-size: 0.75rem; color: #0b3d91; font-weight: 800; margin-top: 10px; text-transform: uppercase; background: #ffd70033; padding: 5px 10px; border-radius: 6px; display: inline-block; border: 1px solid #f59e0b; }

.btn-voltar { padding: 15px; background: #0b3d91; border: none; color: white; font-weight: bold; cursor: pointer; border-top: 2px solid #f59e0b; }
</style>
</head>

<body>

<header>
<img src="imagens/logo.png" alt="V">
<h1>VUNONGUE IA INTELIGENTE</h1>
<img src="imagens/insignia.png" alt="A">
</header>

<div class="chat-container">
    <div class="messages" id="messages">
        <div class="message bot"><div class="bubble">
            Olá 👋 Sou a IA <b>VUNONGUE</b>!<br>
            Podes perguntar sobre o Cubango, história, ciências ou qualquer matéria dos teus livros.<br>
            <b>O que queres saber?</b>
        </div></div>
    </div>

    <div id="loading" class="loading">🔍 Vunongue está a processar o seu pedido...</div>

    <div class="sugestoes">
        <span onclick="perguntar('Quem foi Agostinho Neto?')">📜 História</span>
        <span onclick="perguntar('O que é a fotossíntese?')">🍃 Ciências</span>
        <span onclick="perguntar('Me fale sobre o Cubango')">🏛️ Cubango</span>
        <span onclick="perguntar('Sistema Solar')">🌍 Universo</span>
    </div>

    <form class="input-area" onsubmit="event.preventDefault(); send();">
        <input id="input" type="text" placeholder="Escreve aqui a tua pergunta...">
        <button type="submit" class="send-btn">➤</button>
    </form>
</div>

<button class="btn-voltar" onclick="window.location.href='index.html'">⬅ VOLTAR AO MENU PRINCIPAL</button>

<script>
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.10.142/pdf.worker.min.js';

const todosOsLivros = [
    {path: "pdfs/hist_nganguela.pdf", disc: "História Local", cl: "Cultura"},
    {path: "pdfs/mat_1.pdf", disc: "Matemática", cl: "1ª"}, {path: "pdfs/lp_1.pdf", disc: "Português", cl: "1ª"},
    {path: "pdfs/edm_1.pdf", disc: "Estudo do Meio", cl: "1ª"}, {path: "pdfs/mat_2.pdf", disc: "Matemática", cl: "2ª"},
    {path: "pdfs/lp_2.pdf", disc: "Português", cl: "2ª"}, {path: "pdfs/edm_2.pdf", disc: "Estudo do Meio", cl: "2ª"},
    {path: "pdfs/mat_3.pdf", disc: "Matemática", cl: "3ª"}, {path: "pdfs/lp_3.pdf", disc: "Português", cl: "3ª"},
    {path: "pdfs/edm_3.pdf", disc: "Estudo do Meio", cl: "3ª"}, {path: "pdfs/mat_4.pdf", disc: "Matemática", cl: "4ª"},
    {path: "pdfs/lp_4.pdf", disc: "Português", cl: "4ª"}, {path: "pdfs/edm_4.pdf", disc: "Estudo do Meio", cl: "4ª"},
    {path: "pdfs/mat_5.pdf", disc: "Matemática", cl: "5ª"}, {path: "pdfs/lp_5.pdf", disc: "Português", cl: "5ª"},
    {path: "pdfs/cn_5.pdf", disc: "Ciências", cl: "5ª"}, {path: "pdfs/geo_5.pdf", disc: "Geografia", cl: "5ª"},
    {path: "pdfs/hist_5.pdf", disc: "História", cl: "5ª"}, {path: "pdfs/mat_6.pdf", disc: "Matemática", cl: "6ª"},
    {path: "pdfs/lp_6.pdf", disc: "Português", cl: "6ª"}, {path: "pdfs/cn_6.pdf", disc: "Ciências", cl: "6ª"},
    {path: "pdfs/geo_6.pdf", disc: "Geografia", cl: "6ª"}, {path: "pdfs/hist_6.pdf", disc: "História", cl: "6ª"}
];

const messagesDiv = document.getElementById('messages');

function addMessage(text, type='bot'){
    const div = document.createElement('div');
    div.className = 'message ' + type;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = text;
    div.appendChild(bubble);
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function perguntar(text){
    document.getElementById('input').value = text;
    send();
}

async function send(){
    const inputField = document.getElementById('input');
    const query = inputField.value.trim().toLowerCase();
    if(!query) return;

    addMessage(inputField.value, 'user');
    inputField.value = '';
    document.getElementById('loading').style.display = 'block';

    // 1. Tentar Base de Conhecimento Rápida
    let resposta = buscarNaBaseConhecimento(query);

    // 2. Se não encontrar, pesquisar nos PDFs
    if (!resposta) {
        resposta = await buscarNosLivros(query);
    }

    document.getElementById('loading').style.display = 'none';
    addMessage(resposta);
}

function buscarNaBaseConhecimento(query) {
    for (let chave in window.BaseConhecimentoIA) {
        const info = window.BaseConhecimentoIA[chave];
        if (info.palavras_chave.some(p => query.includes(p))) {
            return info.resumo + `<br><br><div class="source-tag">⚡ Resposta Rápida (Base de Dados)</div>`;
        }
    }
    return null;
}

async function buscarNosLivros(query) {
    const termos = query.split(' ').filter(t => t.length > 3);
    if(termos.length === 0) return "Podes ser mais específico?";

    for (const livro of todosOsLivros) {
        try {
            const loadingTask = pdfjsLib.getDocument(livro.path);
            const pdf = await loadingTask.promise;
            for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const text = content.items.map(item => item.str).join(' ');
                if (termos.some(t => text.toLowerCase().includes(t))) {
                    const pos = text.toLowerCase().indexOf(termos[0]);
                    const snippet = text.substring(Math.max(0, pos - 40), Math.min(text.length, pos + 350));
                    return `Encontrei isto nos teus manuais:<br><br><i>"...${snippet}..."</i><br><br><div class="source-tag">📚 Fonte: ${livro.disc} - ${livro.cl}</div>`;
                }
            }
        } catch(e) { continue; }
    }
    return "Não encontrei uma explicação detalhada. Tenta perguntar sobre outro tema!";
}
</script>

</body>
</html>
