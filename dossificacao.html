<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dossificação</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{ margin:0; font-family:'Inter',sans-serif; background:#000; color:#fff; min-height:100vh; display:flex; flex-direction:column; }
header{ background:rgba(11,61,145,0.9); padding:20px; text-align:center; border-bottom:3px solid #FFD700; position: sticky; top: 0; z-index: 100; }
.main{ flex:1; padding:20px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:20px; }
.livro{ background:#1e1e1e; padding:10px; border-radius:10px; text-align:center; cursor:pointer; transition:.3s; border: 1px solid #333; }
.livro:hover{ transform:translateY(-10px); box-shadow:0 10px 20px rgba(255,215,0,.3); border-color:#FFD700; }
.livro img{ width:100%; height:180px; object-fit:cover; border-radius:5px; margin-bottom:8px; }
.livro-nome{ font-size: 0.75rem; font-weight: bold; color: #eee; height: 35px; overflow: hidden; }
.btn-voltar { background:#cc0000; color:white; border:none; padding:12px 30px; border-radius:10px; font-weight:bold; cursor:pointer; margin: 20px auto; display: block; text-decoration: none; width: fit-content; }
</style>
</head>
<body>
<header><h2>DOSSIFICAÇÃO</h2></header>
<div class="main">
    <div class="grid" id="gridDossificacao"></div>
    <a href="estudo.html" class="btn-voltar">⬅ Voltar</a>
</div>
<script>
const dossificacao = [
    {id: "doss_1", nome: "Dossificação 1ª Classe"},
    {id: "doss_2", nome: "Dossificação 2ª Classe"},
    {id: "doss_3", nome: "Dossificação 3ª Classe"},
    {id: "doss_4", nome: "Dossificação 4ª Classe"},
    {id: "doss_5", nome: "Dossificação 5ª Classe"},
    {id: "doss_6", nome: "Dossificação 6ª Classe"}
];
const grid = document.getElementById("gridDossificacao");
dossificacao.forEach(d => {
    grid.innerHTML += `
    <div class="livro" onclick="abrirPDF('${d.id}.pdf')">
        <img src="imagens/${d.id}.jpg" onerror="this.src='imagens/livro.png'">
        <div class="livro-nome">${d.nome}</div>
    </div>`;
});
function abrirPDF(arquivo){
    if (window.Android && Android.abrirPdf) { Android.abrirPdf(arquivo); }
    else { alert("Abrindo: " + arquivo); }
}
</script>
</body>
</html>
