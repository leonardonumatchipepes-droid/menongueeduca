<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programas Educacionais</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{ margin:0; font-family:'Inter',sans-serif; background:#000; color:#fff; min-height:100vh; display:flex; flex-direction:column; }
header{ background:rgba(11,61,145,0.9); padding:20px; text-align:center; border-bottom:3px solid #FFD700; position: sticky; top: 0; z-index: 100; }
.main{ flex:1; padding:20px; }
.classe-section { margin-bottom: 30px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; border-left: 4px solid #FFD700; }
.classe-titulo { font-size: 1.3rem; color: #FFD700; margin-bottom: 15px; border-bottom: 1px solid #333; padding-bottom: 5px; }
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:15px; }
.livro{ background:#1e1e1e; padding:10px; border-radius:10px; text-align:center; cursor:pointer; transition:.3s; border: 1px solid #444; }
.livro:hover{ transform:translateY(-5px); box-shadow:0 5px 15px rgba(255,215,0,.2); border-color:#FFD700; }
.livro img{ width:60px; height:60px; object-fit:contain; margin-bottom:8px; opacity: 0.8; }
.livro-nome{ font-size: 0.8rem; font-weight: bold; color: #eee; }
.btn-voltar { background:#cc0000; color:white; border:none; padding:12px 30px; border-radius:10px; font-weight:bold; cursor:pointer; margin: 20px auto; display: block; text-decoration: none; width: fit-content; }
</style>
</head>
<body>
<header><h2>PROGRAMAS EDUCACIONAIS</h2></header>
<div class="main" id="conteudo">
    <!-- Seções serão geradas via JS -->
</div>
<a href="estudo.html" class="btn-voltar">⬅ Voltar</a>

<script>
const disciplinas = {
    "lp": "Língua Portuguesa",
    "mat": "Matemática",
    "edm": "Estudo do Meio",
    "em": "Ed. Musical",
    "ef": "Ed. Física",
    "emp": "Ed. Plástica",
    "cn": "Ciências Nat.",
    "geo": "Geografia",
    "hist": "História",
    "emc": "Ed. Moral e Cívica"
};

const estrutura = {
    1: ["lp", "mat", "edm", "em", "ef", "emp"],
    2: ["lp", "mat", "edm", "em", "ef", "emp"],
    3: ["lp", "mat", "edm", "em", "ef", "emp"],
    4: ["lp", "mat", "edm", "em", "ef", "emp"],
    5: ["lp", "mat", "cn", "geo", "hist", "emc", "emp", "em", "ef"],
    6: ["lp", "mat", "cn", "geo", "hist", "emc", "emp", "em", "ef"]
};

const container = document.getElementById("conteudo");

for (let cl = 1; cl <= 6; cl++) {
    let html = `
    <div class="classe-section">
        <div class="classe-titulo">${cl}ª CLASSE</div>
        <div class="grid">`;

    estrutura[cl].forEach(disc => {
        const fileName = `prog_${cl}_${disc}.pdf`;
        html += `
        <div class="livro" onclick="abrirPDF('${fileName}')">
            <img src="imagens/livro.png">
            <div class="livro-nome">${disciplinas[disc]}</div>
        </div>`;
    });

    html += `</div></div>`;
    container.innerHTML += html;
}

function abrirPDF(arquivo){
    if (window.Android && Android.abrirPdf) { Android.abrirPdf(arquivo); }
    else { alert("Abrindo: " + arquivo); }
}
</script>
</body>
</html>
