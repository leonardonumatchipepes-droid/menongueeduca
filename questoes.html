<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=0.9, user-scalable=no">
    <title>Quiz Game - Menongue Educa</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0b3d91;
            --secondary: #f59e0b;
            --card-bg: rgba(255, 255, 255, 0.1);
        }
        * { box-sizing: border-box; margin:0; padding:0; }
        body {
            font-family: 'Fredoka', sans-serif;
            background: #f0f2f5 url('imagens/vunongue.png') no-repeat center center fixed;
            background-size:cover;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            overflow-x: hidden;
        }
        body::before {
            content: "";
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(4px);
            z-index:-1;
        }
        .container { max-width: 600px; width: 90%; text-align: center; }
        h1 { color: var(--secondary); font-size: 2.2rem; text-shadow: 2px 2px 10px black; margin-bottom: 20px; }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            margin-bottom: 20px;
        }
        select, input, button { padding: 14px; margin: 12px 0; border: none; border-radius: 15px; font-size: 16px; width: 100%; outline: none; }
        input, select { background: white; color: #333; font-weight: 500; }
        button { background: var(--secondary); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 0 #cc6600; }
        button:active { transform: translateY(3px); box-shadow: 0 2px 0 #cc6600; }

        #quiz-container { display: none; }
        #timer { font-size: 22px; color: var(--secondary); margin-bottom: 15px; font-weight: bold; }
        #pergunta { font-size: 1.4rem; margin: 20px 0; line-height: 1.4; color: #fff; text-shadow: 1px 1px 2px black; }

        .opcao-btn {
            display: block;
            background: rgba(11, 61, 145, 0.8);
            margin: 14px 0;
            padding: 18px;
            border-radius: 18px;
            cursor: pointer;
            font-size: 1.1rem;
            color: white;
            border: 2px solid transparent;
            text-align: center;
            width: 100%;
            transition: 0.2s;
        }
        .opcao-btn:hover { background: #0d47a1; border-color: var(--secondary); }

        #progresso { font-size: 15px; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 10px; margin-top: 20px; color: #00ff95; }

        .resultado-box { padding: 10px; }
        .resultado-box h2 { color: var(--secondary); margin-bottom: 10px; }
        .btn-acao { margin-top: 10px; }

        @media(max-width:600px){
            h1 { font-size: 1.8rem; }
            .card { padding: 20px; }
            .opcao-btn { padding: 15px; font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 Menongue Educa</h1>

    <!-- TELA INICIAL -->
    <div id="setup-container" class="card">
        <input type="text" id="nomeAluno" placeholder="Escreve o teu nome">
        <select id="selectClasse">
            <option value="1">1ª Classe</option>
            <option value="2">2ª Classe</option>
            <option value="3">3ª Classe</option>
            <option value="4">4ª Classe</option>
            <option value="5">5ª Classe</option>
            <option value="6">6ª Classe</option>
        </select>
        <select id="selectDisciplina">
            <option value="Matematica">Matemática</option>
            <option value="Portugues">Português</option>
            <option value="CienciasNatureza">Ciências da Natureza</option>
            <option value="EstudoDoMeio">Estudo do Meio</option>
            <option value="Historia">História</option>
            <option value="Geografia">Geografia</option>
            <option value="EMC">Moral e Cívica</option>
            <option value="Musica">Educação Musical</option>
        </select>
        <button onclick="iniciarJogo()">🚀 INICIAR DESAFIO</button>
    </div>

    <!-- TELA DO QUIZ -->
    <div id="quiz-container" class="card">
        <div id="timer">⏱ 15s</div>
        <h2 id="pergunta">Carregando pergunta...</h2>
        <div id="opcoes"></div>
        <div id="progresso"></div>
    </div>
</div>

<!-- ELEMENTOS DE ÁUDIO -->
<audio id="somCerto" src="som/certo.mp3"></audio>
<audio id="somErrado" src="som/errado.mp3"></audio>

<!-- SCRIPTS DE DADOS -->
<script src="dados/BancoPerguntasMatematica.js"></script>
<script src="dados/BancoPerguntasPortugues.js"></script>
<script src="dados/BancoPerguntasCienciasNatureza.js"></script>
<script src="dados/BancoPerguntasEstudoDoMeio.js"></script>
<script src="dados/BancoPerguntasHistoria.js"></script>
<script src="dados/BancoPerguntasGeografia.js"></script>
<script src="dados/BancoPerguntasEMC.js"></script>
<script src="dados/BancoPerguntasMusica.js"></script>

<!-- SCRIPT DE LÓGICA UNIFICADO -->
<script src="sistemaQuiz.js"></script>

<script>
    function iniciarJogo() {
        const nome = document.getElementById("nomeAluno").value.trim();
        const classe = document.getElementById("selectClasse").value;
        const disc = document.getElementById("selectDisciplina").value;

        if (!nome) {
            alert("Por favor, diz-nos o teu nome para começar!");
            return;
        }

        localStorage.setItem("nomeAluno", nome);

        document.getElementById("setup-container").style.display = "none";
        document.getElementById("quiz-container").style.display = "block";

        gerarQuiz(classe, disc);
    }
</script>

</body>
</html>
