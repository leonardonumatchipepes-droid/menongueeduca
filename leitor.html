<!DOCTYPE html>
<html lang="pt-AO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador - Menongue Educa</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #222; display: flex; align-items: center; justify-content: center; }
        .btn-web { background: #f59e0b; color: white; padding: 15px 30px; border-radius: 10px; text-decoration: none; font-weight: bold; font-family: sans-serif; }
        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div id="view" style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;">
        <p style="color: white; font-family: sans-serif;">A carregar livro...</p>
    </div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const file = urlParams.get('file');

    if (file) {
        const filePath = "pdfs/" + file;

        // 1. Verificar se estamos dentro do App Android
        if (window.Android && window.Android.abrirPdf) {
            window.Android.abrirPdf(file);
            // Voltar para a estante após abrir no app
            window.history.back();
        } else {
            // 2. Se estiver na WEB (Browser)
            // Tenta abrir direto. Se o browser suportar PDF, ele exibe.
            document.getElementById('view').innerHTML = `<iframe src="${filePath}"></iframe>`;

            // Fallback: Se após 2 segundos não carregar (comum em mobile web), mostra link de download
            setTimeout(() => {
                if (document.querySelector('iframe').contentDocument === null) {
                    document.getElementById('view').innerHTML = `
                        <div style="text-align:center">
                            <p style="color:white; margin-bottom:20px;">O teu navegador não consegue exibir PDF diretamente.</p>
                            <a href="${filePath}" class="btn-web" target="_blank">ABRIR / BAIXAR LIVRO</a>
                        </div>`;
                }
            }, 2000);
        }
    } else {
        document.getElementById('view').innerHTML = "<p style='color:white'>Erro: Ficheiro não especificado.</p>";
    }
</script>
</body>
</html>
